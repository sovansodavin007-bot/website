<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DAVIN PHONE SHOP | DAVIN STORE</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: #c8ff00;
      color: #3700ff;
    }

    header {
      background: #ffffff;
      border-bottom: 1px solid #e2e8f0;
      padding: 15px 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
      gap: 15px;
      flex-wrap: wrap;
    }

    .logo {
      font-size: 24px;
      font-weight: 800;
      color: #2563eb;
      text-decoration: none;
    }

    .logo span {
      color: #0f172a;
    }

    .search-input {
      padding: 10px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      width: 100%;
      max-width: 380px;
      font-size: 14px;
    }

    .cart-btn {
      background: #0f172a;
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }

    .hero {
      background: linear-gradient(135deg, #0f172a, #1e3a8a);
      color: white;
      padding: 50px 5%;
      text-align: center;
    }

    .hero h1 {
      font-size: 36px;
      margin-bottom: 10px;
    }

    .hero p {
      color: #cbd5e1;
      margin-bottom: 20px;
    }

    .container {
      max-width: 1200px;
      margin: 30px auto;
      padding: 0 5%;
    }

    .tabs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 24px;
    }

    .tab {
      background: #ffffff;
      border: 1px solid #cbd5e1;
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
    }

    .tab.active {
      background: #2563eb;
      color: white;
      border-color: #2563eb;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 20px;
    }

    .card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
    }

    .phone-graphic {
      height: 170px;
      background: #f1f5f9;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 14px;
    }

    .brand {
      font-size: 12px;
      font-weight: 700;
      color: #2563eb;
      text-transform: uppercase;
    }

    .title {
      font-size: 18px;
      font-weight: 700;
      margin: 4px 0;
    }

    .specs {
      font-size: 13px;
      color: #64748b;
      margin-bottom: 16px;
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid #ffffff;
      padding-top: 12px;
    }

    .price {
      font-size: 20px;
      font-weight: 800;
    }

    .add-btn {
      background: #ff007b;
      color: rgb(255, 255, 255);
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
    }

    /* Cart Modal */
    .cart-box {
      position: fixed;
      top: 0;
      right: -380px;
      width: 100%;
      max-width: 360px;
      height: 100vh;
      background: rgb(230, 0, 255);
      box-shadow: -4px 0 20px rgba(0, 0, 0, 0.2);
      padding: 20px;
      transition: right 0.3s;
      z-index: 200;
      display: flex;
      flex-direction: column;
    }

    .cart-box.open {
      right: 0;
    }

    .cart-items {
      flex-grow: 1;
      overflow-y: auto;
      margin: 15px 0;
    }

    .cart-item {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid #e2e8f0;
    }

    .checkout-btn {
      background: #10b981;
      color: white;
      border: none;
      padding: 12px;
      width: 100%;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <a href="#" class="logo">Phone<span>Shop</span></a>
    <input type="text" class="search-input" id="searchInput" placeholder="Search phone..." oninput="render()" />
    <button class="cart-btn" onclick="toggleCart()">Cart (<span id="cartCount">0</span>)</button>
  </header>

  <section class="hero">
    <h1>DAVIN PHONE STORE</h1>
    <p>100% Unlocked Phones • 1-Year Official Warranty • Fast Delivery</p>
  </section>

  <main class="container">
    <div class="tabs">
      <button class="tab active" onclick="setBrand('All', this)">All</button>
      <button class="tab" onclick="setBrand('Apple', this)">Apple</button>
      <button class="tab" onclick="setBrand('Samsung', this)">Samsung</button>
      <button class="tab" onclick="setBrand('Google', this)">Google</button>
      <button class="tab" onclick="setBrand('Xiaomi', this)">Xiaomi</button>
      <button class="tab" onclick="setBrand('Oppo', this)">Oppo</button>
      <button class="tab" onclick="setBrand('Vivo', this)">Vivo</button>
    </div>

    <div class="grid" id="phoneGrid"></div>
  </main>

  <aside class="cart-box" id="cartBox">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <h2>Shopping Cart</h2>
      <button onclick="toggleCart()" style="font-size:22px; background:none; border:none; cursor:pointer;">&times;</button>
    </div>
    <div class="cart-items" id="cartItems"></div>
    <div>
      <div style="display:flex; justify-content:space-between; font-weight:800; font-size:18px; margin-bottom:12px;">
        <span>Total:</span>
        <span id="cartTotal">$0</span>
      </div>
      <button class="checkout-btn" onclick="checkout()">Order Now</button>
    </div>
  </aside>

  <script>
    function drawPhone(color) {
      return `
        <svg width="80" height="145" viewBox="0 0 80 145">
          <rect x="4" y="4" width="72" height="137" rx="14" fill="#0f172a" stroke="#475569" stroke-width="2"/>
          <rect x="9" y="9" width="62" height="127" rx="10" fill="${color}"/>
          <rect x="28" y="14" width="24" height="6" rx="3" fill="#0f172a"/>
        </svg>`;
    }

    const phones = [
      { id: 1, brand: "Apple", name: "iPhone 17 Pro Max", price: 10, specs: "6.9\" OLED • A19 Pro • 256GB", color: "#2563eb" },
      { id: 2, brand: "Apple", name: "iPhone 17", price: 8, specs: "6.1\" OLED • A19 • 128GB", color: "#3b82f6" },
      { id: 3, brand: "Samsung", name: "Galaxy S26 Ultra", price: 5, specs: "6.8\" AMOLED • 200MP • 512GB", color: "#4f46e5" },
      { id: 4, brand: "Samsung", name: "Galaxy Z Flip 7", price: 5, specs: "6.7\" Foldable • 256GB", color: "#7c3aed" },
      { id: 5, brand: "Google", name: "Pixel 10 Pro", price: 5, specs: "6.3\" LTPO • Tensor G5 • 256GB", color: "#059669" },
      { id: 6, brand: "Xiaomi", name: "Xiaomi 15 Ultra", price: 5, specs: "6.73\" 2K • Leica Camera • 512GB", color: "#dc2626" },
      { id: 7, brand: "Oppo", name: "Oppo Find X8 Pro", price: 5, specs: "6.78\" AMOLED • Dimensity 9400", color: "#0284c7" },
      { id: 8, brand: "Vivo", name: "Vivo X200 Pro", price: 5, specs: "6.78\" ZEISS 200MP • 512GB", color: "#1d4ed8" }
    ];

    let currentBrand = "All";
    let cart = [];

    function setBrand(brand, btn) {
      currentBrand = brand;
      document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
      btn.classList.add("active");
      render();
    }

    function render() {
      const q = document.getElementById("searchInput").value.toLowerCase();
      const filtered = phones.filter(p =>
        (currentBrand === "All" || p.brand === currentBrand) &&
        (p.name.toLowerCase().includes(q) || p.specs.toLowerCase().includes(q))
      );

      document.getElementById("phoneGrid").innerHTML = filtered.map(p => `
        <div class="card">
          <div>
            <div class="phone-graphic">${drawPhone(p.color)}</div>
            <span class="brand">${p.brand}</span>
            <h3 class="title">${p.name}</h3>
            <p class="specs">${p.specs}</p>
          </div>
          <div class="card-footer">
            <span class="price">$${p.price}</span>
            <button class="add-btn" onclick="addToCart(${p.id})">+ Cart</button>
          </div>
        </div>
      `).join("");
    }

    function addToCart(id) {
      const item = cart.find(i => i.id === id);
      if (item) item.qty++;
      else cart.push({ ...phones.find(p => p.id === id), qty: 1 });
      updateCart();
      document.getElementById("cartBox").classList.add("open");
    }

    function updateCart() {
      const count = cart.reduce((s, i) => s + i.qty, 0);
      const total = cart.reduce((s, i) => s + i.price * i.qty, 0);
      document.getElementById("cartCount").textContent = count;
      document.getElementById("cartTotal").textContent = "$" + total.toLocaleString();
      document.getElementById("cartItems").innerHTML = cart.length === 0
        ? "<p style='color:#64748b;'>Cart is empty</p>"
        : cart.map(i => `
          <div class="cart-item">
            <div><strong>${i.name}</strong><br><small>$${i.price} x ${i.qty}</small></div>
            <strong>$${(i.price * i.qty).toLocaleString()}</strong>
          </div>
        `).join("");
    }

    function toggleCart() {
      document.getElementById("cartBox").classList.toggle("open");
    }

    function checkout() {
      if (cart.length === 0) return alert("Cart is empty!");
      alert("Order confirmed! Thank you.");
      cart = [];
      updateCart();
      toggleCart();
    }

    render();
  </script>
</body>
</html>
